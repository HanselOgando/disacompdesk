[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Versiones únicas para todo el workspace: cada crate las hereda con
# `nombre = { workspace = true }`.
[workspace.dependencies]
disacomp-capture = { path = "crates/capture" }
disacomp-protocol = { path = "crates/protocol" }
disacomp-transport = { path = "crates/transport" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# `ring` como proveedor criptográfico: compila en Windows sin herramientas extra
# (aws-lc-rs, la alternativa, necesita CMake/NASM).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = "1.54.1"
# Enlaces oficiales de Microsoft a la API de Windows. Cada `feature` activa un
# grupo de funciones; solo se piden las de Direct3D 11 y DXGI.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
# `deny` y no `forbid`: los crates de plataforma (captura, entrada) necesitarán
# `unsafe` para llamar a la API de Windows y lo habilitarán de forma explícita.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
